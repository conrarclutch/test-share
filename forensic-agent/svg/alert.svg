<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" class="forensic-icon" data-state="alert" role="img" aria-labelledby="forensic-alert-title forensic-alert-desc">
  <title id="forensic-alert-title">Forensic agent, alert</title>
  <desc id="forensic-alert-desc">A forensic agent signals caution with a steady exclamation mark inside its lens.</desc>
  <style>

  .forensic-icon { overflow: visible; }
  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }
  .forensic-icon .motion { transform-box: view-box; }
  .forensic-icon[data-paused="true"] .motion { animation-play-state: paused !important; }


  .forensic-alert-head { transform-origin: 64px 68px; animation: forensic-alert-head 2.4s ease-out infinite; }
  .forensic-alert-reticle { opacity: .2; }
  .forensic-alert-mark { transform-origin: 80px 63px; animation: forensic-alert-mark 2.4s ease-out infinite; }
  @keyframes forensic-alert-mark {
    0%, 32%, 100% { transform: rotate(0deg); }
    8% { transform: rotate(-3deg); }
    16% { transform: rotate(3deg); }
    24% { transform: rotate(-2deg); }
  }
  @keyframes forensic-alert-head {
    0%, 30%, 100% { transform: rotate(0deg); }
    7% { transform: rotate(-2deg); }
    15% { transform: rotate(2deg); }
    23% { transform: rotate(-1deg); }
  }

  .forensic-icon[data-reduced-motion="true"] .motion { animation: none !important; }
.forensic-icon[data-reduced-motion="true"] .forensic-alert-mark, .forensic-icon[data-reduced-motion="true"] .forensic-alert-head { transform: none !important; }
    .forensic-icon[data-reduced-motion="true"] .forensic-alert-reticle { opacity: .2 !important; }
  @media (prefers-reduced-motion: reduce) {
    .forensic-icon:not([data-reduced-motion="false"]) .motion { animation: none !important; }
.forensic-icon:not([data-reduced-motion="false"]) .forensic-alert-mark, .forensic-icon:not([data-reduced-motion="false"]) .forensic-alert-head { transform: none !important; }
    .forensic-icon:not([data-reduced-motion="false"]) .forensic-alert-reticle { opacity: .2 !important; }
  }
  </style>


  <g class="forensic-alert-head forensic-face motion forensic-stroke" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 31h40c12 0 21 9 21 21v32c0 12-9 21-21 21H44c-12 0-21-9-21-21V52c0-12 9-21 21-21Z"/>
    <path class="forensic-brow" d="M37 50c4-4 9-5 14-3" stroke-width="6"/>
    <circle class="forensic-left-eye" fill="currentColor" stroke="none" cx="43" cy="68" r="5.5"/>
    <circle class="forensic-lens-ring" cx="80" cy="63" r="14"/>
    <g class="forensic-alert-reticle forensic-reticle forensic-stroke" stroke-width="3.5">
      <path d="M80 50v4M80 72v4M67 63h4M89 63h4"/>
    </g>
    <path d="M53 92c7 4 15 4 22-1"/>
  <g class="forensic-alert-mark forensic-stroke motion" stroke-width="3.5">
    <path d="M80 56.5v8"/>
    <circle class="forensic-solid" cx="80" cy="69" r="1.7"/>
  </g></g>
</svg>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forensic — motion studio</title>
<style>

.shell{max-width:1320px;margin:0 auto;padding:46px 48px 30px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:36px}h1{font-family:Georgia,serif;font-size:clamp(36px,4.4vw,58px);line-height:1.08;font-weight:400;letter-spacing:-.025em;margin:0 0 12px}header p{margin:0;color:var(--muted);line-height:1.5;font-size:17px}.signature{border-bottom:1px solid var(--line);padding-bottom:6px;font-size:14px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:36px;align-items:start}

100%}.thumb .motion{animation:none!important}.state-copy{flex:1}.state-name{display:block;font-size:17px;font-weight:600;margin-bottom:4px}.state-purpose{display:block;font-size:12px;color:var(--muted)}.state-indicator{width:7px;height:7px;border-radius:50%;background:transparent;margin:0 8px}.state-button[aria-pressed="true"] .state-indicator{background:currentColor}.reduced-control{display:flex;gap:10px;align-items:center;margin-top:22px;font-size:13px;color:var(--muted)}input[type="checkbox"]{accent-color:var(--ink);width:16px;height:16px;margin:0}.footer{border-top:1px solid var(--line);margin-top:36px;padding-top:20px;display:flex;gap:20px;justify-content:space-between;font-size:12px;color:var(--muted);line-height:1.5}.reduced-notice{font-size:12px;min-height:18px;margin:8px 0 0;color:var(--muted)}

</style></head><body><main class="shell">

<footer class="footer"><span>Transparent vectors. One color. The same curious character.</span><a href="README.md">Usage notes</a></footer>
</main><script>
const states=[{"state":"idle","name":"Idle","file":"svg/idle.svg","duration":4.8,"description":"A quiet breath and an occasional blink. Ready for the next clue.","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" class=\"forensic-icon\" data-state=\"idle\" role=\"img\" aria-labelledby=\"forensic-idle-title forensic-idle-desc\">\n  \u003ctitle id=\"forensic-idle-title\">Forensic agent, idle\u003c/title>\n  \u003cdesc id=\"forensic-idle-desc\">A calm forensic agent with a subtle breathing motion and occasional blink.\u003c/desc>\n  \u003cstyle>\n\n  .forensic-icon { overflow: visible; }\n  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }\n  .forensic-icon .motion { transform-box: view-box; }\n  .forensic-icon[data-paused=\"true\"] .motion { animation-play-state: paused !important; }\n\n\n  .forensic-idle-breathe { transform-origin: 64px 68px; animation: forensic-idle-breathe 4.8s ease-in-out infinite; }\n  .forensic-idle-blink { transform-origin: 43px 68px; animation: forensic-idle-blink 4.8s ease-in-out infinite; }\n  @keyframes forensic-idle-breathe {\n    0%, 100% { transform: translateY(0); }\n    45%, 62% { transform: translateY(-2px); }\n  }\n  @keyframes forensic-idle-blink {\n    0%, 42%, 52%, 100% { transform: scaleY(1); }\n    46%, 49% { transform: scaleY(0.08); }\n  }\n\n  .forensic-icon[data-reduced-motion=\"true\"] .motion { animation: none !important; }\n.forensic-icon[data-reduced-motion=\"true\"] .forensic-idle-face { transform: none !important; }\n  @media (prefers-reduced-motion: reduce) {\n    .forensic-icon:not([data-reduced-motion=\"false\"]) .motion { animation: none !important; }\n.forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-idle-face { transform: none !important; }\n  }\n  \u003c/style>\n  \n\n  \u003cg class=\"forensic-idle-face forensic-idle-breathe motion forensic-stroke\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    \u003cpath d=\"M44 31h40c12 0 21 9 21 21v32c0 12-9 21-21 21H44c-12 0-21-9-21-21V52c0-12 9-21 21-21Z\"/>\n    \u003cpath class=\"forensic-brow\" d=\"M37 50c4-4 9-5 14-3\" stroke-width=\"6\"/>\n    \u003ccircle class=\"forensic-idle-blink forensic-left-eye motion\" fill=\"currentColor\" stroke=\"none\" cx=\"43\" cy=\"68\" r=\"5.5\"/>\n    \u003ccircle class=\"forensic-lens-ring\" cx=\"80\" cy=\"63\" r=\"14\"/>\n    \u003cg class=\"forensic-reticle\" stroke-width=\"3.5\">\n      \u003cpath d=\"M80 50v4M80 72v4M67 63h4M89 63h4\"/>\n    \u003c/g>\n    \u003cpath d=\"M53 92c7 4 15 4 22-1\"/>\n  \u003c/g>\n\u003c/svg>\n"},{"state":"scanning","name":"Scanning","file":"svg/scanning.svg","duration":3.2,"description":"The optical eye sweeps for a signal while the reticle turns.","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" class=\"forensic-icon\" data-state=\"scanning\" role=\"img\" aria-labelledby=\"forensic-scanning-title forensic-scanning-desc\">\n  \u003ctitle id=\"forensic-scanning-title\">Forensic agent, scanning\u003c/title>\n  \u003cdesc id=\"forensic-scanning-desc\">A forensic agent scans through its lens with a rotating reticle and a clipped light beam.\u003c/desc>\n  \u003cstyle>\n\n  .forensic-icon { overflow: visible; }\n  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }\n  .forensic-icon .motion { transform-box: view-box; }\n  .forensic-icon[data-paused=\"true\"] .motion { animation-play-state: paused !important; }\n\n\n  .forensic-scanning-reticle { transform-origin: 80px 63px; animation: forensic-scanning-reticle 3.2s linear infinite; }\n  .forensic-scanning-beam { transform-origin: 80px 63px; animation: forensic-scanning-beam 3.2s ease-in-out infinite; opacity: .58; }\n  .forensic-scanning-gaze { transform-origin: 43px 68px; animation: forensic-scanning-gaze 3.2s ease-in-out infinite; }\n  @keyframes forensic-scanning-reticle { to { transform: rotate(360deg); } }\n  @keyframes forensic-scanning-beam {\n    0%, 100% { transform: translateX(-8px); opacity: .18; }\n    50% { transform: translateX(8px); opacity: .68; }\n  }\n  @keyframes forensic-scanning-gaze {\n    0%, 100% { transform: translate(0, 0); }\n    48%, 62% { transform: translate(2px, -1px); }\n  }\n\n  .forensic-icon[data-reduced-motion=\"true\"] .motion { animation: none !important; }\n.forensic-icon[data-reduced-motion=\"true\"] .forensic-scanning-beam { opacity: .5 !important; transform: none !important; }\n    .forensic-icon[data-reduced-motion=\"true\"] .forensic-scanning-reticle, .forensic-icon[data-reduced-motion=\"true\"] .forensic-scanning-gaze { transform: none !important; }\n  @media (prefers-reduced-motion: reduce) {\n    .forensic-icon:not([data-reduced-motion=\"false\"]) .motion { animation: none !important; }\n.forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-scanning-beam { opacity: .5 !important; transform: none !important; }\n    .forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-scanning-reticle, .forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-scanning-gaze { transform: none !important; }\n  }\n  \u003c/style>\n  \u003cdefs>\u003cclipPath id=\"forensic-scanning-lens-clip\">\u003ccircle cx=\"80\" cy=\"63\" r=\"13.7\"/>\u003c/clipPath>\u003c/defs>\n\n  \u003cg class=\"forensic-face forensic-stroke\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    \u003cpath d=\"M44 31h40c12 0 21 9 21 21v32c0 12-9 21-21 21H44c-12 0-21-9-21-21V52c0-12 9-21 21-21Z\"/>\n    \u003cpath class=\"forensic-brow\" d=\"M37 50c4-4 9-5 14-3\" stroke-width=\"6\"/>\n    \u003ccircle class=\"forensic-scanning-gaze forensic-left-eye forensic-solid motion\" fill=\"currentColor\" stroke=\"none\" cx=\"43\" cy=\"68\" r=\"5.5\"/>\n    \u003ccircle class=\"forensic-lens-ring\" cx=\"80\" cy=\"63\" r=\"14\"/>\n    \u003cg class=\"forensic-scanning-reticle forensic-reticle forensic-stroke motion\" stroke-width=\"3.5\">\n      \u003cpath d=\"M80 50v4M80 72v4M67 63h4M89 63h4\"/>\n    \u003c/g>\n    \u003cpath d=\"M53 92c7 4 15 4 22-1\"/>\n  \u003cg clip-path=\"url(#forensic-scanning-lens-clip)\">\u003crect class=\"forensic-scanning-beam forensic-solid motion\" x=\"79\" y=\"49\" width=\"2\" height=\"28\" rx=\"1\"/>\u003c/g>\u003c/g>\n\u003c/svg>\n"},{"state":"inspecting","name":"Inspecting","file":"svg/inspecting.svg","duration":3.6,"description":"A curious tilt and raised brow bring a clue into focus.","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" class=\"forensic-icon\" data-state=\"inspecting\" role=\"img\" aria-labelledby=\"forensic-inspecting-title forensic-inspecting-desc\">\n  \u003ctitle id=\"forensic-inspecting-title\">Forensic agent, inspecting\u003c/title>\n  \u003cdesc id=\"forensic-inspecting-desc\">A curious forensic agent tilts its head, raises one brow, and turns its eye toward the lens.\u003c/desc>\n  \u003cstyle>\n\n  .forensic-icon { overflow: visible; }\n  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }\n  .forensic-icon .motion { transform-box: view-box; }\n  .forensic-icon[data-paused=\"true\"] .motion { animation-play-state: paused !important; }\n\n\n  .forensic-inspecting-head { transform-origin: 64px 68px; animation: forensic-inspecting-head 3.6s ease-in-out infinite; }\n  .forensic-inspecting-brow { transform-origin: 43px 48px; animation: forensic-inspecting-brow 3.6s ease-in-out infinite; }\n  .forensic-inspecting-gaze { transform-origin: 43px 68px; animation: forensic-inspecting-gaze 3.6s ease-in-out infinite; }\n  @keyframes forensic-inspecting-head {\n    0%, 100% { transform: rotate(0deg); }\n    22%, 76% { transform: rotate(5deg); }\n  }\n  @keyframes forensic-inspecting-brow {\n    0%, 100% { transform: translateY(0); }\n    20%, 78% { transform: translateY(-3px); }\n  }\n  @keyframes forensic-inspecting-gaze {\n    0%, 100% { transform: translate(0, 0); }\n    22% { transform: translate(4px, -1px); }\n    42%, 76% { transform: translate(3px, -1px); }\n  }\n\n  .forensic-icon[data-reduced-motion=\"true\"] .motion { animation: none !important; }\n.forensic-icon[data-reduced-motion=\"true\"] .forensic-inspecting-head, .forensic-icon[data-reduced-motion=\"true\"] .forensic-inspecting-brow, .forensic-icon[data-reduced-motion=\"true\"] .forensic-inspecting-gaze { transform: none !important; }\n  @media (prefers-reduced-motion: reduce) {\n    .forensic-icon:not([data-reduced-motion=\"false\"]) .motion { animation: none !important; }\n.forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-inspecting-head, .forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-inspecting-brow, .forensic-icon:not([data-reduced-motion=\"false\"]) .forensic-inspecting-gaze { transform: none !important; }\n  }\n  \u003c/style>\n  \n\n  \u003cg class=\"forensic-inspecting-face forensic-inspecting-head motion forensic-stroke\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    \u003cpath d=\"M44 31h40c12 0 21 9 21 21v32c0 12-9 21-21 21H44c-12 0-21-9-21-21V52c0-12 9-21 21-21Z\"/>\n    \u003cpath class=\"forensic-inspecting-brow forensic-brow forensic-stroke motion\" d=\"M37 50c4-4 9-5 14-3\" stroke-width=\"6\"/>\n    \u003ccircle class=\"forensic-inspecting-gaze forensic-left-eye forensic-solid motion\" fill=\"currentColor\" stroke=\"none\" cx=\"43\" cy=\"68\" r=\"5.5\"/>\n    \u003ccircle class=\"forensic-lens-ring\" cx=\"80\" cy=\"63\" r=\"14\"/>\n    \u003cg class=\"forensic-reticle\" stroke-width=\"3.5\">\n      \u003cpath d=\"M80 50v4M80 72v4M67 63h4M89 63h4\"/>\n    \u003c/g>\n    \u003cpath d=\"M53 92c7 4 15 4 22-1\"/>\n  \u003c/g>\n\u003c/svg>\n"},{"state":"thinking","name":"Thinking","file":"svg/thinking.svg","duration":2.4,"description":"Three small signals work through the evidence inside the lens.","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" class=\"forensic-icon\" data-state=\"thinking\" role=\"img\" aria-labelledby=\"forensic-thinking-title forensic-thinking-desc\">\n  \u003ctitle id=\"forensic-thinking-title\">Forensic agent, thinking\u003c/title>\n  \u003cdesc id=\"forensic-thinking-desc\">A forensic agent considers evidence while three small dots appear inside its lens.\u003c/desc>\n  \u003cstyle>\n\n  .forensic-icon { overflow: visible; }\n  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }\n  .forensic-icon .motion { transform-box: view-box; }\n  .forensic-icon[data-paused=\"true\"] .motion { animation-play-state: paused !important; }\n\n\n  .forensic-thinking-reticle { transform-origin: 80px 63px; animation: forensic-thinking-reticle 2.4s ease-in-out infinite; }\n  .forensic-thinking-dot { opacity: .18; }\n  .forensic-thinking-dot-1 { animation: forensic-thinking-dot-1 2.4s ease-in-out infinite; }\n  .forensic-thinking-dot-2 { animation: forensic-thinking-dot-2 2.4s ease-in-out infinite; }\n  .forensic-thinking-dot-3 { animation: forensic-thinking-dot-3 2.4s ease-in-out infinite; }\n  @keyframes forensic-thinking-reticle {\n    0%, 100% { transform: rotate(0deg); }\n    50% { transform: rotate(-12deg); }\n  }\n  @keyframes forensic-thinking-dot-1 {\n    0%, 12%, 100% { opacity: .18; }\n    18%, 34% { opacity: 1; }\n  }\n  @keyframes forensic-thinking-dot-2 {\n    0%, 28%, 100% { opacity: .18; }\n    36%, 52% { opacity: 1; }\n  }\n  @keyframes forensic-thinking-dot-3 {\n    0%, 48%, 100% { opacity: .18; }\n    56%, 72% { opacity: 1; }\n  }\n n acknowledging nod.","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 128\" class=\"forensic-icon\" data-state=\"found\" role=\"img\" aria-labelledby=\"forensic-found-title forensic-found-desc\">\n  \u003ctitle id=\"forensic-found-title\">Forensic agent, found evidence\u003c/title>\n  \u003cdesc id=\"forensic-found-desc\">A forensic agent acknowledges a finding as its reticle resolves into a check mark inside the lens.\u003c/desc>\n  \u003cstyle>\n\n  .forensic-icon { overflow: visible; }\n  .forensic-icon .forensic-stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n  .forensic-icon .forensic-solid { fill: currentColor; stroke: none; }\n  .forensic-icon .motion { transform-box: view-box; }\n  .forensic-icon[data-paused=\"true\"] .motion { animation-play-state: paused !important; }\n\n\n  .forensic-found-nod { transform-origin: 64px 68px; animation: forensic-found-nod 2.2s ease-in-out infinite; }\n  .forensic-found-reticle { animation: forensic-found-reticle 2.2s ease-in-out infinite; }\n  .forensic-found-check { opacity: 0; stroke-dasharray: 22; stroke-dashoffset: 22; animation: forensic-found-check 2.2s ease-in-out infinite; }\n  @keyframes forensic-found-nod {\n    0%, 19%, 100% { transform: translateY(0); }\n    38%, 53% { transform: translateY(1.5px); }\n    69% { transform: translateY(0); }\n  }\n  @keyframes forensic-found-reticle {\n    0%, 28%, 100% { opacity: 1; }\n    53%, 88% { opacity: .12; }\n  }\n  @keyframes forensic-found-check {\n    0%, 28% { opacity: 0; stroke-dashoffset: 22; }\n    48% { opacity: 1; stroke-dashoffset: 22; }\n    64%, 86% { opacity: 1; stroke-dashoffset: 0; }\n    100% { opacity: 0; stroke-dashoffset: 22; }\n  }\n\n  .forensic-icon[data-reduced-motion=\"true\"] .motion { animation: none !important; }\n.forensic-icon[data-reduced-motion=\"true\"] .forensic-found-nod, .forensic-icon[data-reduced-motion=\"true\"] .forensic-found-reticle { transform: none !important; }\ const byId=id=>document.getElementById(id);
const hero=byId('hero'),stage=byId('stage');
const purposes={idle:'Ready and listening',scanning:'Looking for a signal',inspecting:'Taking a closer look',thinking:'Connecting the evidence',found:'A result is ready',alert:'Needs your attention'};
let current='scanning',paused=false,offscreen=false;
const reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
function unique(svg,prefix){const ids=[...svg.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);for(const id of ids)svg=svg.replaceAll(id,prefix+'-'+id);return svg;}
function syncPlayback(){const icon=hero.querySelector('svg');if(icon){icon.dataset.paused=String(paused||offscreen||document.hidden);icon.dataset.reducedMotion=String(byId('reduced').checked);}byId('play').textContent=paused?'Play':'Pause';byId('play').setAttribute('aria-label',paused?'Play animation':'Pause animation');const rate=Number(byId('speed').value);if(typeof hero.getAnimations === 'function')hero.getAnimations({subtree:true}).forEach(a=>a.updatePlaybackRate(rate));}
function selectState(state){current=state;const item=states.find(x=>x.state===state);hero.innerHTML=unique(item.svg,'hero');byId('state-name').textContent=item.name;byId('state-description').textContent=item.description;byId('timing').textContent=item.name+' · '+item.duration+'s loop';byId('download').href=item.file;byId('download').download='forensic-'+item.state+'.svg';document.querySelectorAll('.state-button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));requestAnimationFrame(syncPlayback);}
states.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='state-button';b.dataset.state=item.state;b.setAttribute('aria-pressed','false');b.innerHTML='<span class="thumb" aria-hidden="true">'+unique(item.svg,'thumb-'+item.state)+'</span><span class="state-copy"><span class="state-name">'+item.name+'</span><span class="state-purpose">'+purposes[item.state]+'</span></span><span class="state-indicator" aria-hidden="true"></span>';b.addEventListener('click',()=>selectState(item.state));byId('state-list').append(b);});
byId('play').addEventListener('click',()=>{paused=!paused;syncPlayback()});byId('replay').addEventListener('click',()=>{paused=false;selectState(current)});byId('speed').addEventListener('change',syncPlayback);
byId('tone').addEventListener('click',()=>{const dark=stage.classList.toggle('dark');byId('tone').textContent=dark?'Light background':'Dark background';byId('tone').setAttribute('aria-pressed',String(dark));});
function reduce(value){byId('reduced').checked=value;document.body.classList.toggle('reduce-motion',value);byId('reduced-notice').textContent=value?'Motion is reduced. Each state keeps its visual cue.':'';byId('play').disabled=value;byId('replay').disabled=value;byId('speed').disabled=value;requestAnimationFrame(syncPlayback)}
byId('reduced').addEventListener('change',e=>reduce(e.target.checked));reducedQuery.addEventListener('change',e=>reduce(e.matches));document.addEventListener('visibilitychange',syncPlayback);new IntersectionObserver(entries=>{offscreen=!entries[0].isIntersecting;syncPlayback()},{threshold:.05}).observe(stage);
reduce(reducedQuery.matches);selectState(current);
</script></body></html>
